services:
  scheduler:
    # GH Actions builds the image. The server only pulls a tested GHCR image.
    image: ${SCHEDULER_IMAGE:-ghcr.io/h-zare-dev/pasarguard-node-scheduler:development}
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/scheduler.sqlite
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    # No host ports and no Docker socket. Outbound HTTPS only.
